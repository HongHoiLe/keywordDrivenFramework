# Configuration Properties for Keyword Driven Framework

# Browser Settings
browser=chrome
headless=false

# URL Settings
baseUrl=https://www.google.com

# Timeout Settings (in seconds)
implicitWait=10
explicitWait=20
pageLoadTimeout=30

# Test Data Settings
testDataPath=src/test/resources/testdata/TestData.xlsx

# Screenshot Settings
screenshotOnFailure=true
screenshotPath=target/screenshots/

# Report Settings
reportPath=target/reports/
